[project]
name = "gs1-digital-link-resolver"
version = "0.1.0"
description = "A GS1 Digital Link resolver: parse identifiers out of the URL and resolve them to links."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
]

[project.urls]
Homepage = "https://github.com/Starfish-Network/gs1-digital-link-resolver"
Issues = "https://github.com/Starfish-Network/gs1-digital-link-resolver/issues"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
example = ["uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs1_digital_link"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
